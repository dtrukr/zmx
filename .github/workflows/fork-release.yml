# dtrukr/zmx fork: upstream neurosnap/zmx main + local patches.
#
# Daily (and on every push to main) this merges upstream main, runs the unit
# and integration tests, and publishes a GitHub release when main moved since
# the last one. A merge conflict or a failing test stops the run before
# anything is pushed or published, so hosts keep the previous release.
#
# Running sessions keep the daemon binary they were started from, so every
# release must still talk to daemons started by older ones:
# - test/compat.bats runs this build's client against daemons started by the
#   previous release and by v0.8.1-fork.f2df749 (the last legacy-header build).
# - An upstream commit marked "BREAKING CHANGE" is never merged automatically:
#   the run fails and opens an issue, and the merge is done by hand together
#   with whatever keeps old daemons reachable (see `ipc.Wire`). A manual
#   dispatch with allow_breaking=true overrides this once that work is in.
#
# Assets per release: upstream-style `zmx-<version>-<os>-<arch>.tar.gz` (+ .sha256)
# and version-less copies (`zmx-macos-aarch64.tar.gz`, ...) so installers can
# use https://github.com/dtrukr/zmx/releases/latest/download/<asset>.
name: fork-release

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      allow_breaking:
        description: "Merge upstream commits marked BREAKING CHANGE (only after old daemons are handled)"
        type: boolean
        default: false
      skip_upstream:
        description: "Release main as it is, without merging upstream (for a fix that must ship while the upstream merge is blocked)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: fork-release
  cancel-in-progress: false

env:
  ZIG_VERSION: "0.17.1"

jobs:
  sync-test-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Merge upstream main
        id: sync
        run: |
          git config user.name "zmx-fork-bot"
          git config user.email "zmx-fork-bot@users.noreply.github.com"
          if [ "${{ inputs.skip_upstream }}" = "true" ]; then
            echo "skip_upstream: releasing main without merging upstream"
            echo "merged=false" >> "$GITHUB_OUTPUT"
            echo "before=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git remote add upstream https://github.com/neurosnap/zmx.git
          git fetch --no-tags upstream main
          before=$(git rev-parse HEAD)
          git merge --no-edit upstream/main
          echo "merged=$([ "$before" != "$(git rev-parse HEAD)" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "before=$before" >> "$GITHUB_OUTPUT"

      - name: Refuse breaking upstream changes
        if: steps.sync.outputs.merged == 'true' && inputs.allow_breaking != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          breaking=""
          for c in $(git rev-list --no-merges "${{ steps.sync.outputs.before }}..HEAD"); do
            if git show -s --format=%B "$c" | grep -qE '^BREAKING[ -]CHANGE'; then
              breaking="$breaking$(git show -s --format='%h %s' "$c")"$'\n'
            fi
          done
          breaking="${breaking%$'\n'}"
          [ -z "$breaking" ] && exit 0
          title="Upstream zmx has a breaking change: merge by hand"
          body=$(printf '%s\n\n%s\n%s\n\n%s\n%s\n' \
            "The daily fork-release run stopped before merging. Running zmx daemons keep their old binary, so a client that cannot talk to them blanks every restored pane." \
            "Breaking commits (upstream/main):" "$(echo "$breaking" | sed 's/^/- /')" \
            "Merge them by hand with whatever keeps old daemons reachable, check test/compat.bats against the previous release," \
            "then rerun this workflow with allow_breaking=true or push the merge.")
          if ! gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number -q '.[0].number' | grep -q .; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
          echo "::error::upstream breaking change, not merging: $breaking"
          exit 1

      - name: Install zig and bats
        run: |
          curl -sSfL --retry 3 -o /tmp/zig.tar.xz \
            "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          tar -xf /tmp/zig.tar.xz -C /tmp
          echo "/tmp/zig-x86_64-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"
          sudo apt-get update -qq && sudo apt-get install -y -qq bats

      - name: Format check
        run: zig fmt --check .

      - name: Unit tests
        run: zig build test

      - name: Fetch old releases for compat tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release hosts are running now, plus the last legacy-header build.
          prev=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          bins=""
          for tag in $(printf '%s\n' "$prev" v0.8.1-fork.f2df749 | sort -u); do
            dir="/tmp/zmx-old/$tag"
            mkdir -p "$dir"
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
              --pattern 'zmx-linux-x86_64.tar.gz' --dir "$dir"
            tar -xzf "$dir/zmx-linux-x86_64.tar.gz" -C "$dir"
            bins="$bins $dir/zmx"
          done
          echo "ZMX_OLD_BINS=${bins# }" >> "$GITHUB_ENV"

      - name: Integration tests
        run: |
          zig build
          # Upstream runs these in `docker run -t`; they assume a controlling
          # tty (zmx opens /dev/tty for the window size), which runners lack.
          PATH="$PWD/zig-out/bin:$PATH" script -qec "bats --jobs 1 test/*.bats" /dev/null

      - name: Push merged main
        if: steps.sync.outputs.merged == 'true'
        run: git push origin HEAD:main

      - name: Decide release
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse --short=7 HEAD)
          base=$(sed -n 's/^ *\.version = "\(.*\)",/\1/p' build.zig.zon)
          tag="v${base}-fork.${sha}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${base}-fork.${sha}" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release binaries
        if: steps.rel.outputs.publish == 'true'
        run: |
          zig build release -Dversion="${{ steps.rel.outputs.version }}"
          cd zig-out/dist
          for f in zmx-*.tar.gz; do
            plain=$(echo "$f" | sed "s/^zmx-${{ steps.rel.outputs.version }}-/zmx-/")
            cp "$f" "$plain"
            shasum -a 256 "$plain" > "$plain.sha256"
          done
          ls -la

      - name: Publish release
        if: steps.rel.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag "${{ steps.rel.outputs.tag }}"
          git push origin "${{ steps.rel.outputs.tag }}"
          gh release create "${{ steps.rel.outputs.tag }}" zig-out/dist/* \
            --repo "$GITHUB_REPOSITORY" --latest \
            --title "zmx ${{ steps.rel.outputs.version }}" \
            --notes "upstream neurosnap/zmx main + dtrukr patches at $(git rev-parse HEAD)"
